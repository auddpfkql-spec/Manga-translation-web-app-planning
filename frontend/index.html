<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>만화 번역기</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>📚 만화 번역기</h1>
    <p>일본어 · 영어 · 중국어 만화를 한국어로 자동 번역합니다.</p>
  </header>

  <main>
    <section class="controls">
      <label>
        소스 언어
        <select id="source-lang">
          <option value="auto">자동 감지</option>
          <option value="ja">일본어</option>
          <option value="en">영어</option>
          <option value="zh">중국어</option>
        </select>
      </label>

      <label class="file-label" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" hidden />
        <span id="file-name">이미지를 선택하거나 여기에 드래그하세요</span>
      </label>

      <button id="translate-btn" disabled>번역하기</button>
    </section>

    <section class="status" id="status" hidden></section>

    <section class="result" hidden id="result-section">
      <div class="result-views">
        <figure>
          <figcaption>원본</figcaption>
          <img id="original-img" alt="원본 이미지" />
        </figure>
        <figure>
          <figcaption>번역 결과</figcaption>
          <img id="result-img" alt="번역 결과" />
        </figure>
      </div>
      <a id="download-link" download="translated.png">결과 다운로드</a>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
